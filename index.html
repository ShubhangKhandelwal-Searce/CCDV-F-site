L["7.4"]={t:"Identity, Secrets, and Key Management",d:7,
lede:"A small skill with clear right answers. Keys live in a secret manager, never in code, prompts, or a repository. The API key identifies your service, never your end user.",
body:`
<h2>Where credentials live</h2>
<div class="tw"><table><thead><tr><th>Environment</th><th>Correct source</th></tr></thead><tbody>
<tr><td>Local development</td><td>Environment variable from an untracked <code>.env</code>, or the OS keychain. Add <code>.env</code> to <code>.gitignore</code> and to <code>permissions.deny</code> as <code>Read(./.env)</code></td></tr>
<tr><td>CI</td><td>The CI provider's secret store, injected at run time and masked in logs</td></tr>
<tr><td>Production</td><td>A managed secret manager with rotation and audit, fetched at start-up or per request</td></tr>
<tr><td>Cloud platforms</td><td>The provider's IAM — a role rather than a key, with no long-lived credential to leak</td></tr>
<tr><td>Browser or mobile client</td><td>Never. Proxy through your server</td></tr>
</tbody></table></div>
<div class="note"><div class="nt">Key concept</div><p>The Anthropic API key authenticates <strong>your application to Anthropic</strong>. It says nothing about who the end user is. End-user identity is your application's job, and every authorisation decision must be made against that identity, server-side.</p></div>
<h2>Practices the exam expects</h2>
<ul>
<li><strong>Separate keys per environment</strong> and per workload, so one can be revoked without an outage everywhere.</li>
<li><strong>Rotate on a schedule</strong>, and immediately on suspected exposure. Design for rotation without downtime by supporting two valid keys during the cutover.</li>
<li><strong>Least privilege</strong> — scope keys to a workspace, and use separate keys for separate products rather than one organisation-wide key.</li>
<li><strong>Never log a key.</strong> Scrub credentials from traces, error reports, and prompt logs.</li>
<li><strong>Never put a secret in a prompt.</strong> It enters context, transcripts, caches, and logs.</li>
<li><strong>Scan the repository.</strong> Pre-commit secret scanning catches the mistake before it is public. A key committed to git is compromised even after the commit is reverted — rotate it.</li>
<li><strong>Monitor usage</strong> per key for anomalies; a sudden spend change is often the first sign of exposure.</li>
</ul>
<h2>Identity in an agent</h2>
<p>An agent acting on a user's behalf needs its own identity discipline:</p>
<ul>
<li>Derive the acting identity from the authenticated session, never from model output or a tool argument.</li>
<li>Issue short-lived, narrowly scoped tokens for tool calls, not the standing service credential.</li>
<li>Check authorisation inside every tool implementation, on every call.</li>
<li>Log the identity each tool call ran as, so the audit trail answers "who did this" and not only "what happened".</li>
<li>Do not let the agent hold a credential broader than the user's own permissions — a confused-deputy problem.</li>
</ul>
<h2>MCP and connector credentials</h2>
<ul>
<li>MCP servers often need their own credentials. Scope them narrowly and store them the same way as any other secret; environment variables for a local stdio server, a secret manager for a remote one.</li>
<li>Prefer OAuth flows where the server supports them, so the user grants access rather than a shared static token being embedded.</li>
<li>Organisations can restrict which MCP servers users may add or connect to, through managed configuration, allowlists, and denylists. That is a credential-boundary control as much as a tooling one.</li>
</ul>
`,
traps:[
["Passing the Anthropic API key through to the browser so the client can stream directly","Every user gets your key. Proxy through your server."],
["Treating the API key as end-user authentication","It authenticates your service only. User identity and authorisation are yours to enforce."],
["Reverting the commit that contained a key and considering it handled","It is in the git history and possibly in clones and caches. Rotate the key."],
["Putting a credential in a system prompt so a tool can use it","Prompts land in transcripts, caches, and logs. Credentials belong in the tool implementation's environment."],
["One organisation-wide key for every service","Scope and separate keys so revocation and rotation are surgical."]
],
src:[["Securely deploying AI agents","https://code.claude.com/docs/en/agent-sdk/secure-deployment"],["Claude Code security","https://code.claude.com/docs/en/security"]]};

L["8.1"]={t:"Tool Implementation",d:8,
lede:"A tool is a prompt as much as it is a function. The description and schema are read by the model on every request, and most 'the model calls the wrong tool' problems are description problems, not model problems.",
body:`
<h2>Anatomy of a good tool</h2>
<pre><code>{
  "name": "get_order_status",
  "description": "Retrieve the current status and delivery estimate for one order. Use this whenever the customer asks where an order is, whether it shipped, or when it will arrive. Requires the order ID; if the customer has not given one, call search_orders first.",
  "input_schema": {
    "type": "object",
    "properties": {
      "order_id": {
        "type": "string",
        "description": "Order ID in the form ORD-12345, as shown on the confirmation email"
      }
    },
    "required": ["order_id"],
    "additionalProperties": false
  }
}</code></pre>
<p>The description does four jobs: what it does, <strong>when to use it</strong>, what it needs, and how it relates to neighbouring tools. The "when" clause is the one people omit and the one that decides whether the tool is ever selected.</p>
<div class="note"><div class="nt">Key concept</div><p>Anthropic's guidance is to write tool descriptions as if for a new engineer who has never seen your system. Ambiguity that a colleague would resolve by asking is ambiguity the model resolves by guessing.</p></div>
<h2>Designing the tool set</h2>
<ul>
<li><strong>Few, distinct tools</strong> beat many overlapping ones. Overlap is where wrong selection comes from — if two tools could plausibly answer the same request, say in each description when to prefer the other.</li>
<li><strong>Right granularity.</strong> Not one <code>do_everything(action, payload)</code> tool, and not forty micro-tools that need six calls to accomplish anything. Aim for the units a competent human would ask for.</li>
<li><strong>Every definition is billed input, every request.</strong> Tool schemas plus a tool-use system prompt of a few hundred tokens are in the window whenever tools are present. Scope the set to the task; where it is genuinely large, use tool search to load definitions on demand.</li>
<li><strong>Constrain in the schema, not in prose.</strong> An <code>enum</code> is worth a paragraph of "valid values are...".</li>
<li><strong>Return what is useful, not what is available.</strong> A tool that returns a 200 KB payload when six fields matter is a context problem you created.</li>
</ul>
<h2>Tool errors</h2>
<pre><code>{
  "type": "tool_result",
  "tool_use_id": "toolu_01ABC",
  "is_error": true,
  "content": "Order ORD-99999 not found. Order IDs look like ORD-12345. Try search_orders with the customer's email."
}</code></pre>
<ul>
<li>Return errors <strong>to the model</strong> as a tool result, rather than raising and killing the loop. An informative error lets Claude recover on the next turn.</li>
<li>Make the message actionable: what went wrong, and what to try instead.</li>
<li>Never leak a stack trace, a connection string, or internal identifiers into the error text — it goes into the context and can reach the user.</li>
<li>Distinguish "not found" from "not permitted" from "service unavailable". Each deserves different agent behaviour.</li>
</ul>
<h2>Client-side, server-side, and approval</h2>
<div class="tw"><table><thead><tr><th>Kind</th><th>Executes</th><th>Notes</th></tr></thead><tbody>
<tr><td><strong>Client-side (custom)</strong></td><td>Your code, between turns</td><td>You control execution, authorisation, and logging. Priced as ordinary tokens</td></tr>
<tr><td><strong>Server-side (built-in)</strong></td><td>Anthropic's infrastructure, inside the turn</td><td>Web search, web fetch, code execution. Reported in <code>usage.server_tool_use</code>; some carry their own charges</td></tr>
<tr><td><strong>MCP tools</strong></td><td>An MCP server, local or remote</td><td>Appear as <code>mcp__&lt;server&gt;__&lt;tool&gt;</code>. Results are untrusted content</td></tr>
</tbody></table></div>
<p>Approval patterns, from most to least permissive: run automatically; ask the user per call; ask once and remember for the session; deny outright. Deny rules are checked first and win everywhere, including in permissive modes. Mutating and irreversible tools should require approval or a deterministic gate; read-only tools usually should not, because prompting on everything trains people to click through.</p>
<h2>Dispatch in an agentic harness</h2>
<p>The harness maps tool names to implementations and executes them between model turns. What a robust dispatcher does:</p>
<ol>
<li>Look up the handler by name; return a clear tool error for an unknown name rather than crashing.</li>
<li>Validate the input against the schema before executing. The model's output is untrusted input.</li>
<li>Check authorisation against the session identity, not against anything in the tool input.</li>
<li>Apply a timeout, and return a timeout as a tool error.</li>
<li>Run independent tool calls from the same turn in parallel where safe; return all results in one user message.</li>
<li>Log the call, its arguments, its outcome, and its duration.</li>
</ol>
<h2>Testing tools</h2>
<ul>
<li>Unit-test the implementation like any function.</li>
<li>Separately test <strong>selection</strong>: given realistic prompts, does Claude pick the right tool with the right arguments? That tests the description and schema, which is where the defects are.</li>
<li>Test the error paths — the model's recovery behaviour is part of the contract.</li>
</ul>
`,
traps:[
["Writing a description that says what the tool does but not when to use it","The 'when' clause is what drives selection. Without it the tool is invisible to the model."],
["Raising an exception when a tool fails","Return <code>is_error: true</code> with a helpful message so Claude can adapt."],
["Adding tools without counting the token cost","Every definition is input on every request, plus a tool-use system prompt whenever any tool is present."],
["Two tools with overlapping descriptions","The model will pick inconsistently. Differentiate them and cross-reference in the descriptions."],
["Trusting tool arguments because the model generated them","Model output is untrusted input. Validate against the schema and authorise server-side."],
["Returning the full API payload as the tool result","It floods the context. Return the fields that matter."]
],
src:[["Tool use overview","https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"],["How to implement tool use","https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"]]};

L["8.2"]={t:"MCP Server Development",d:8,
lede:"MCP is the open protocol that lets one server expose capabilities to many clients. Its value on the exam is almost always the same: reuse across applications, maintained independently of any one of them.",
body:`
<h2>The model</h2>
<p>A <strong>host</strong> application (Claude Code, Claude Desktop, your Agent SDK app) runs one <strong>client</strong> per connected <strong>server</strong>. The server exposes capabilities; the client surfaces them to the model.</p>
[[FIG:mcp]]
<div class="tw"><table><thead><tr><th>Primitive</th><th>Controlled by</th><th>Is</th></tr></thead><tbody>
<tr><td><strong>Tools</strong></td><td>The model</td><td>Functions Claude can call. The primitive you will use most</td></tr>
<tr><td><strong>Resources</strong></td><td>The application</td><td>Readable data identified by URI — files, records, documents</td></tr>
<tr><td><strong>Prompts</strong></td><td>The user</td><td>Reusable templates the user invokes, typically as slash commands</td></tr>
</tbody></table></div>
<h2>Transports</h2>
<div class="tw"><table><thead><tr><th>Transport</th><th>Shape</th><th>Use for</th></tr></thead><tbody>
<tr><td><strong>stdio</strong></td><td>The client launches the server as a subprocess and speaks JSON-RPC over stdin/stdout</td><td>Local servers: filesystem, local database, developer tooling. No network exposure</td></tr>
<tr><td><strong>HTTP / SSE</strong></td><td>A remote server over HTTP, streaming with server-sent events</td><td>Shared, centrally hosted servers used by many people. Needs authentication and transport security</td></tr>
<tr><td><strong>In-process (SDK)</strong></td><td>An MCP server running inside your own application process</td><td>Exposing your own Python or TypeScript functions to the Agent SDK without a separate process</td></tr>
</tbody></table></div>
<p>A stdio server inherits the environment of the process that launched it, which is how it receives credentials. A remote server needs real authentication — OAuth where supported, so users grant access instead of sharing a static token.</p>
<h2>When MCP is the right answer</h2>
<div class="note"><div class="nt">The exam signal</div><p>Look for the words <strong>reusable across several applications</strong> and <strong>maintained independently</strong>. That is an MCP server. A capability needed by exactly one application is a custom tool — building a server for it adds a process, a protocol, and a deployment for no gain.</p></div>
<div class="tw"><table><thead><tr><th>Situation</th><th>Answer</th></tr></thead><tbody>
<tr><td>Several Claude applications need the same internal API</td><td>MCP server</td></tr>
<tr><td>One application needs one internal function</td><td>Custom tool</td></tr>
<tr><td>A vendor already publishes a server for their product</td><td>Connect to it; do not rebuild it</td></tr>
<tr><td>You need the model to browse the live web</td><td>Built-in server-side tool, not a custom server</td></tr>
<tr><td>You need a documented procedure, not a new capability</td><td>A Skill</td></tr>
</tbody></table></div>
<h2>Authoring guidance</h2>
<ul>
<li><strong>Tool descriptions are prompts.</strong> Everything from 8.1 applies unchanged.</li>
<li><strong>Namespace cleanly.</strong> Tools surface as <code>mcp__&lt;server&gt;__&lt;tool&gt;</code>; a plugin-bundled server adds the plugin to the segment. Matchers and permission rules are written against that full name.</li>
<li><strong>Keep the surface small.</strong> A server exposing sixty tools floods the context of every client that connects. Group by task, and rely on tool search where the set must be large.</li>
<li><strong>Return compact results</strong> with a field to request more detail, rather than everything by default.</li>
<li><strong>Handle errors in-protocol</strong> so the client can pass an informative failure back to the model.</li>
<li><strong>Version and document</strong> the server. Several applications depend on it now; a breaking change breaks all of them at once.</li>
</ul>
<h2>Security considerations</h2>
<ul>
<li>A server's output is <strong>untrusted content</strong> to the model, even when you wrote the server, because the data it returns may come from elsewhere.</li>
<li>Authorise inside the server against the caller, not against arguments the model supplied.</li>
<li>Scope credentials to the minimum the server needs.</li>
<li>Third-party servers are a supply-chain risk: they run code and see your data. Review them, and prefer an organisation-approved list. Administrators can restrict which servers may be added or connected with managed configuration and allow or deny lists.</li>
</ul>
`,
traps:[
["Building an MCP server for a capability only one application will ever use","That is a custom tool. MCP earns its cost through reuse."],
["Assuming a built-in tool can reach an arbitrary internal REST API","Built-in tools are a fixed set. Internal systems need a custom tool or an MCP server."],
["Exposing an entire API surface as one tool per endpoint","Sixty tool definitions in every client's context. Design task-level tools."],
["Trusting MCP results because the server is yours","The data inside may be attacker-controlled. Treat results as untrusted content."],
["Writing a permission rule against the bare server name","Tools are namespaced <code>mcp__&lt;server&gt;__&lt;tool&gt;</code>. Match with <code>mcp__server__.*</code>."]
],
src:[["Connect Claude Code to tools via MCP","https://code.claude.com/docs/en/mcp"],["MCP in the Agent SDK","https://code.claude.com/docs/en/agent-sdk/mcp"],["MCP specification","https://modelcontextprotocol.io"]]};

L["8.3"]={t:"Agentic Customization",d:8,
lede:"Four ways to extend Claude — built-in tools, custom tools, Skills, and MCP — and one decision tree that items keep asking you to walk. The distinction that matters most: a Skill teaches a procedure, a tool grants a capability.",
body:`
<h2>The four options</h2>
<div class="tw"><table><thead><tr><th>Option</th><th>Gives Claude</th><th>Lives</th><th>Cost in context</th></tr></thead><tbody>
<tr><td><strong>Built-in tool</strong></td><td>A capability Anthropic maintains: web search, web fetch, code execution, bash, text editor, computer use</td><td>Anthropic's infrastructure or the harness</td><td>Definition tokens; some carry usage charges</td></tr>
<tr><td><strong>Custom tool</strong></td><td>A capability you implement, for this application</td><td>Your code</td><td>Definition tokens on every request</td></tr>
<tr><td><strong>Skill</strong></td><td>Knowledge and procedure — how <em>you</em> want a task done</td><td>A folder with <code>SKILL.md</code> and supporting files</td><td>Near zero until invoked, then only what it loads</td></tr>
<tr><td><strong>MCP server</strong></td><td>A capability shared across applications, over a standard protocol</td><td>A separate process or service</td><td>Definition tokens per connected tool</td></tr>
</tbody></table></div>
[[FIG:choose]]
<h2>The decision tree</h2>
<ol>
<li><strong>Does Claude already have the capability?</strong> Use the built-in tool. Do not rebuild web search.</li>
<li><strong>Is it knowledge or procedure rather than a new capability?</strong> Skill. If Claude already <em>can</em> do it but does it wrong, the gap is instruction, not tooling.</li>
<li><strong>Is it a new capability needed by several applications, or maintained by a separate team?</strong> MCP server.</li>
<li><strong>Is it a new capability for this one application?</strong> Custom tool.</li>
<li><strong>Must it happen deterministically, every time?</strong> None of the above — a hook or a permission rule.</li>
</ol>
<div class="note"><div class="nt">Key concept</div><p>A <strong>Skill teaches a procedure; a tool grants a capability.</strong> "Claude does not know our report format" is a Skill. "Claude cannot query our warehouse" is a tool or an MCP server. "Claude must never drop a table" is a hook.</p></div>
<h2>Skills in more depth</h2>
<p>A Skill is a folder containing <code>SKILL.md</code> with <code>name</code> and <code>description</code> frontmatter, plus any scripts, templates, and reference files. The model reads only the name and description until the task matches, then loads the body, then loads supporting files as needed. That progressive disclosure is why skills scale where CLAUDE.md does not: a hundred skills cost almost nothing until one is relevant.</p>
<ul>
<li>Skills can bundle executable scripts, so they are not limited to prose.</li>
<li>Skills can declare hooks in frontmatter, which stay registered for the session after invocation.</li>
<li>Plugin-provided skills are namespaced by plugin.</li>
<li>Skills are portable across Claude surfaces in a way that a bespoke tool implementation is not.</li>
</ul>
<h2>Comparing on the axes items use</h2>
<div class="tw"><table><thead><tr><th>Axis</th><th>Built-in</th><th>Custom tool</th><th>Skill</th><th>MCP</th></tr></thead><tbody>
<tr><td>Reuse across apps</td><td>Universal</td><td>One app</td><td>Portable files</td><td>Designed for it</td></tr>
<tr><td>Maintenance owner</td><td>Anthropic</td><td>Your app team</td><td>Whoever owns the folder</td><td>A separate team or vendor</td></tr>
<tr><td>Grants new capability</td><td>Yes</td><td>Yes</td><td>No</td><td>Yes</td></tr>
<tr><td>Always in context</td><td>Yes, when registered</td><td>Yes, when registered</td><td>No — on demand</td><td>Yes, when connected</td></tr>
<tr><td>Deployment overhead</td><td>None</td><td>Low</td><td>None</td><td>A service to run and secure</td></tr>
</tbody></table></div>
<h2>Combining them</h2>
<p>Real systems use all four, and items sometimes ask for the combination. A code-review agent might use built-in file tools to read, an MCP server to reach the issue tracker, a Skill encoding the team's review checklist, a custom tool to post the verdict to an internal service, and a <code>PreToolUse</code> hook that blocks any write outside the working directory. Each layer does the job it is shaped for.</p>
<h2>Plugins as the packaging</h2>
<p>A plugin bundles commands, skills, subagents, hooks, and MCP servers into one installable unit distributed through a marketplace. When an item asks how to give a whole team the same extensions consistently, the answer is a plugin from an organisation marketplace, with versions pinned — not a README telling everyone which files to copy.</p>
`,
traps:[
["Building a custom tool for something a built-in tool already does","Rebuilding web search or code execution adds cost and maintenance for no capability."],
["Using a Skill to grant a capability Claude does not have","Skills carry instructions and files. They cannot reach your database on their own."],
["Putting a rarely used procedure in CLAUDE.md instead of a Skill","CLAUDE.md is loaded every session. Skills load on demand — that is the whole point."],
["Choosing MCP for a single-application capability","The protocol, process, and deployment only pay off across multiple consumers."],
["Solving a 'must always happen' requirement with any of the four","None of them is deterministic. That is a hook or a permission rule."]
],
src:[["Extend Claude Code","https://code.claude.com/docs/en/features-overview"],["Agent Skills overview","https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview"],["Create plugins","https://code.claude.com/docs/en/plugins"]]};

{i:"q101",d:1,s:"1.1",q:"An invoice-processing pipeline runs the same four steps on every document: extract fields, validate against the PO, classify the exception type, and write to the ledger. The steps never change order. Which architecture fits best?",
o:["An agent with all four operations exposed as tools, letting it decide the order","A deterministic workflow that chains four model calls in a fixed sequence","A manager agent that spawns four subagents in parallel","A single prompt asking Claude to do all four steps at once"],a:1,
r:"The sequence is known in advance and never varies, so control flow belongs in your code. A workflow is cheaper, faster, testable, and auditable. An agent adds non-determinism for no benefit, parallel subagents break the dependency chain, and one prompt for four distinct stages degrades quality on each."},
{i:"q102",d:1,s:"1.1",q:"A team wants an agent that audits a large monorepo. Early runs exhaust the context window before finishing. Which structural change addresses the cause?",
o:["Raise max_tokens so responses are not truncated","Use subagents so each area is explored in an isolated context and only findings return to the manager","Increase the iteration cap so the agent has more turns to finish","Switch to a model with a higher temperature for more varied exploration"],a:1,
r:"Context exhaustion is a context-isolation problem. Subagents burn their own windows and return compact findings, so the manager context stays small. max_tokens governs output length only, more iterations make the problem worse, and temperature is unrelated."},
{i:"q103",d:1,s:"1.1",q:"A payments agent must obtain a fraud check before any transfer above a threshold. Compliance requires that this can never be skipped. What is the correct implementation?",
o:["Add a strongly worded rule to the system prompt describing the requirement","Enforce the check programmatically in the transfer path, outside the model's control","Use multi-shot examples that always show the fraud check being performed first","Set tool_choice to any so the agent must always call a tool"],a:1,
r:"Absolute compliance requirements are enforcement problems, not prompting problems. Prompts and examples influence behaviour but do not guarantee it. Programmatic enforcement — code, a permission rule, or a hook — is the only answer that cannot be talked out of."},
{i:"q104",d:1,s:"1.1",q:"Which description matches the orchestrator–workers pattern rather than parallelisation?",
o:["Three predefined subtasks always run concurrently and their results are merged","The same prompt runs five times and the majority answer is taken","A lead model reads the task, decides at run time how to split it, and dispatches to workers","A classifier routes each input to one of several specialised prompts"],a:2,
r:"The distinguishing feature of orchestrator–workers is that the decomposition happens at run time, decided by the model. Predefined concurrent subtasks are parallelisation by sectioning, repeated runs are parallelisation by voting, and the classifier case is routing."},
{i:"q105",d:1,s:"1.2",q:"A developer's agent loop terminates early on complex requests. The loop checks whether response.content[0].type equals 'text' to decide the task is done. What is the fix?",
o:["Add an iteration cap of 15 so the loop runs long enough","Branch on response.stop_reason: continue while it is tool_use, stop at end_turn","Set tool_choice to any so Claude never returns plain text","Parse the assistant text for a completion phrase before exiting"],a:1,
r:"Claude routinely returns explanatory text alongside a tool_use block, so a content-type check reports completion while work remains. stop_reason is the deterministic signal. Iteration caps address runaway loops, not premature exit; forcing tool_choice prevents the agent from ever finishing; and parsing natural language reintroduces ambiguity."},
{i:"q106",d:1,s:"1.2",q:"After Claude returns tool_use blocks and your code executes the tools, how must the results be sent back?",
o:["As a message with role assistant containing tool_result blocks","As a new system prompt containing the tool output","As a message with role user containing tool_result blocks that echo each tool_use_id","As a plain text user message describing what the tools returned"],a:2,
r:"Tool results are returned in a user-role message as tool_result blocks, each carrying the matching tool_use_id. The assistant message containing the tool_use blocks must also be appended to history first. Plain text loses the linkage, and there is no system-prompt mechanism for results."},
{i:"q107",d:1,s:"1.2",q:"A team builds an agent with the Claude Agent SDK. It ignores the conventions in the project's CLAUDE.md. What is the most likely cause?",
o:["CLAUDE.md is only read by the claude.ai web interface","setting_sources was not configured, so the SDK did not load project settings","CLAUDE.md files over 100 lines are silently skipped","The SDK requires CLAUDE.md to be named AGENTS.md"],a:1,
r:"By default the Agent SDK does not load CLAUDE.md, settings files, or project slash commands. You opt in with setting_sources in Python or settingSources in TypeScript. Claude Code reads CLAUDE.md, not AGENTS.md, but that is not what causes this symptom."},
{i:"q108",d:1,s:"1.2",q:"Which statement about Agent SDK permission handling is correct?",
o:["bypassPermissions is the recommended production setting because it avoids interruptions","A deny rule blocks a tool even when the session runs in bypassPermissions mode","allowed_tools overrides any deny rule that names the same tool","Permission modes apply only to built-in tools, not to MCP tools"],a:1,
r:"Deny rules are checked first and win, including in bypassPermissions mode. bypassPermissions grants full autonomous system access and belongs only in a controlled sandbox. Allow rules do not override deny rules, and permission handling covers MCP tools too."},
{i:"q109",d:1,s:"1.3",q:"An agent repeatedly calls the same search tool with identical arguments and makes no progress. Which cause should you investigate first?",
o:["The model temperature is set too low","Tool results are not being appended to the conversation history","The system prompt is too short","max_tokens is set too high"],a:1,
r:"Repeating an identical call is the classic signature of the model never seeing the result. If the tool_result never reaches history, the model has no new information and re-requests the same thing. Temperature, prompt length, and max_tokens do not produce this pattern."},
{i:"q110",d:1,s:"1.3",q:"A long-running agent must remember a plan across a context compaction. What is the most reliable approach?",
o:["Repeat the plan in every user message","Write the plan to a file the agent can re-read after compaction","Increase the context window by switching models","Rely on the compaction summary to retain the plan"],a:1,
r:"Compaction is lossy by design, so anything held only in the conversation is at risk. Writing the plan to a file makes it durable and selectively re-readable. Repeating it every turn wastes tokens, and a bigger window delays the problem without solving it."},
{i:"q111",d:1,s:"1.3",q:"Which task is the poorest fit for splitting across parallel subagents?",
o:["Searching six services for references to a deprecated field","Reviewing one pull request for security, performance, and style","A refactor where each file's change depends on the type signature produced by the previous file","Gathering documentation from four independent vendor sites"],a:2,
r:"Parallelism requires independence. When each step consumes the previous step's output, parallel subagents work from absent or stale information. The other three are genuinely independent and compress well into summaries."},
{i:"q112",d:1,s:"1.3",q:"What is the primary tradeoff a team accepts when adopting an agentic framework such as LangGraph or PydanticAI instead of calling the Messages API directly?",
o:["Frameworks make the model more accurate but cost more per token","Frameworks provide state management and observability but add an abstraction layer that complicates unusual requirements and debugging","Frameworks eliminate the need for evals","Frameworks remove the need to handle rate limits"],a:1,
r:"A framework buys state handling, retries, and observability at the cost of indirection between your code and the API. It does not change model accuracy, remove the need for evals, or handle rate limits for you. Anthropic's guidance is to start direct and add abstraction when it earns its place."},

/* ---------------- DOMAIN 2 ---------------- */
{i:"q201",d:2,s:"2.3",q:"A developer must process 10,000 documents overnight for a non-urgent analytics report. Cost is the primary concern. Which approach best fits?",
o:["Send every request synchronously through the Messages API in parallel to finish as fast as possible","Use the Message Batches API, which processes large asynchronous workloads within a 24-hour window at reduced cost","Lower max_tokens on synchronous calls to minimise cost","Switch to the smallest available model regardless of output quality"],a:1,
r:"The Batch API is built for latency-tolerant, high-volume work and discounts input and output by 50%. Parallel synchronous requests finish sooner but cost the same per token, max_tokens only caps output length, and blindly downsizing the model ignores the batch-versus-realtime tradeoff the requirement describes."},
{i:"q202",d:2,s:"2.3",q:"A response returns with stop_reason set to max_tokens. What has happened?",
o:["Claude finished its answer and stopped naturally","The output was cut off at your max_tokens ceiling and is incomplete","The context window was exceeded by the input","Claude declined to answer the request"],a:1,
r:"max_tokens means generation hit your output ceiling mid-answer. Treating it as a complete response silently corrupts downstream data. end_turn is natural completion, model_context_window_exceeded is the window case, and refusal is a decline."},
{i:"q203",d:2,s:"2.3",q:"Your system prompt and a large reference document are cached, but cache_read_input_tokens is always zero. The prompt begins with a line containing the current timestamp. What is wrong?",
o:["The cache TTL expired between requests","Caching requires the 1-hour TTL to be set explicitly","The changing timestamp at the start invalidates the entire cached prefix","cache_control can only be applied to tool definitions"],a:2,
r:"Caching matches on prefixes, so anything that changes at the front invalidates everything after it. Volatile content belongs at the end, after the stable tools, system prompt, and documents. TTL expiry would show intermittent hits rather than a constant zero."},
{i:"q204",d:2,s:"2.3",q:"Which statement about streaming with the Messages API is correct?",
o:["Tool input arrives as a complete JSON object in a single event","An error can arrive as an event inside the stream after a 200 response","The final stop_reason appears in the message_start event","Streaming is unavailable when tools are in use"],a:1,
r:"Streaming errors can surface as an error event after the HTTP status has already been returned, so error handling must live inside the stream. Tool input arrives as input_json_delta fragments that must be accumulated, stop_reason appears in message_delta near the end, and tools work fine with streaming."},
{i:"q205",d:2,s:"2.3",q:"Where does the system prompt belong in a Messages API request?",
o:["As the first element of the messages array with role 'system'","As a top-level system parameter on the request","Inside the tools array as a special tool definition","As metadata on the first user message"],a:1,
r:"The Messages API takes system as a top-level parameter. There is no system role in the messages array — messages alternate between user and assistant."},
{i:"q206",d:2,s:"2.3",q:"A team adds cache_control to a 400-token system prompt on Claude Sonnet 5 and sees no cost reduction and no error. Why?",
o:["Prompt caching must be enabled on the account before use","The prompt is below the model's minimum cacheable length, so nothing is stored","cache_control works only with the Batch API","Sonnet 5 does not support prompt caching"],a:1,
r:"Each model has a minimum cacheable prefix length — 1,024 tokens for Sonnet 5. Below it nothing is cached and no error is returned, which is why the failure is silent. Verify with the cache_creation and cache_read usage fields."},
{i:"q207",d:2,s:"2.3",q:"Which pair of discounts can be combined on the same workload?",
o:["Batch API and prompt caching","Batch API and fast mode","Fast mode and Managed Agents session runtime discounts","Prompt caching and a lower max_tokens setting"],a:0,
r:"Batch and prompt caching stack, as do residency multipliers. Fast mode is not available with the Batch API, and max_tokens is not a discount — it caps output length."},
{i:"q208",d:2,s:"2.5",q:"A rule works when engineers use Claude Code but is ignored by the team's production API integration. The rule lives in the repository's CLAUDE.md. What explains this?",
o:["CLAUDE.md must be renamed AGENTS.md for API access","CLAUDE.md is a Claude Code and Agent SDK mechanism; API requests carry only what you put in the request","The API caches CLAUDE.md for 24 hours before applying it","CLAUDE.md applies only to models with a 1M context window"],a:1,
r:"The Messages API sends exactly what is in the request body. CLAUDE.md is read by Claude Code, and by the Agent SDK when setting sources are configured. To apply the rule through the API, put it in the system prompt."},
{i:"q209",d:2,s:"2.5",q:"You are designing a prompt that summarises user-uploaded documents. Which ordering is best?",
o:["Instruction first, then the untrusted document","The untrusted document first inside delimiters, then the instruction","Instruction and document interleaved paragraph by paragraph","The document in the system prompt and the instruction in the user turn"],a:1,
r:"Placing untrusted content first inside labelled delimiters and the instruction last means the model's final reading is your task rather than the document's contents. It also keeps the volatile document out of the cacheable system prefix and preserves the trust boundary."},
{i:"q210",d:2,s:"2.5",q:"Which statement about CLAUDE.md is accurate?",
o:["It is injected into the system prompt and is enforced configuration","It is delivered as a user message after the system prompt and is context, not enforcement","It overrides managed policy settings","It is evaluated only when Claude reads a file in the same directory"],a:1,
r:"CLAUDE.md arrives as a user message after the system prompt. Claude reads and tries to follow it, but there is no compliance guarantee — anything that must hold needs a hook or a permission rule. Managed policy sits above user and project scopes, and root-level files load at launch."},
{i:"q211",d:2,s:"2.6",q:"The same settings key is defined in ~/.claude/settings.json, .claude/settings.json, and .claude/settings.local.json. Which value applies?",
o:["The user settings value","The shared project settings value","The project local settings value","The values are merged into an array"],a:2,
r:"Precedence runs managed, then command line, then project local, then shared project, then user. Project local sits above both project and user for scalar keys. List keys such as permissions.allow merge instead of overriding — that asymmetry is the thing to remember."},
{i:"q212",d:2,s:"2.6",q:"A team commits .claude/settings.json with permission allow rules, but teammates still get prompts for those commands. What is happening?",
o:["Allow rules from a repository file apply only after each teammate trusts the folder","Allow rules cannot be set in project settings at all","The file must be named settings.local.json to be read","Allow rules require the bypassPermissions mode"],a:0,
r:"permissions.allow, additionalDirectories, and a few other keys wait for each person to accept workspace trust for the folder. deny and ask rules apply immediately — which is why security rules take effect even before trust."},
{i:"q213",d:2,s:"2.6",q:"How do CLAUDE.md files at different scopes interact?",
o:["The most specific file replaces all broader ones","They are concatenated, broadest first, so the most specific is read last","Only the project file is loaded; user and managed files are ignored","They are merged alphabetically by filename"],a:1,
r:"CLAUDE.md files concatenate rather than override, loading from managed policy down through user, project, and local scopes, root-down through the directory tree. Settings files are the ones with a precedence winner."},
{i:"q214",d:2,s:"2.6",q:"A developer adds // comments to .claude/settings.json to document each key. What happens?",
o:["Comments are supported and ignored at parse time","The file fails to parse and Claude Code reports a settings error","Only the commented keys are skipped","Comments are stripped and written back on the next save"],a:1,
r:"Settings files are strict JSON. A // comment or a trailing comma is a syntax error, and the file is reported as a Settings Error at the start of an interactive session."},
{i:"q215",d:2,s:"2.4",q:"An integration retries every failed Claude API call with exponential backoff, including 400 and 401 responses. What is the problem?",
o:["Nothing; retrying everything is the safest default","4xx client errors will never succeed on retry and just consume quota and time","Backoff should be linear rather than exponential for 4xx errors","400 errors should be retried more aggressively than 429"],a:1,
r:"Client errors mean the request itself is wrong, so retrying is pure waste. Retry 429, 500, 504, and 529 with exponential backoff and jitter; fix 400, 401, 402, 403, 404, and 413 instead."},
{i:"q216",d:2,s:"2.4",q:"Which file should be excluded from version control in a Claude Code project?",
o:[".claude/settings.json",".claude/settings.local.json","CLAUDE.md",".claude/skills/"],a:1,
r:"settings.local.json holds personal overrides and the standing approvals Claude Code saves for you. Claude Code adds it to your global git excludes when it writes it. The shared settings file, CLAUDE.md, and skills are meant to be committed so the team shares them."},
{i:"q217",d:2,s:"2.4",q:"A service classifies 5,000 documents with asyncio.gather over all of them at once and begins failing. What is the appropriate fix if results are needed within the hour?",
o:["Switch to synchronous calls in a for loop","Bound concurrency with a semaphore and retry failures with backoff","Increase max_tokens so fewer calls are needed","Move the work to the Batch API"],a:1,
r:"Unbounded fan-out trips rate limits. A semaphore plus retries keeps throughput high without overrunning the limit. Batch is the right answer when the work can wait up to 24 hours, but not within the hour; a serial loop is needlessly slow; max_tokens is unrelated."},
{i:"q218",d:2,s:"2.1",q:"A requirement states that summaries must be accurate and must not invent details. Which response best turns this into something implementable?",
o:["Add 'be accurate and do not hallucinate' to the system prompt","Define measurable criteria, build an eval set from real documents, and require citations back to the source","Raise the model tier until the problem stops appearing","Lower the temperature to zero"],a:1,
r:"Quality words are not implementable as written. They become a measurable definition, a labelled eval set, and grounding mechanisms such as required citations and an explicit null option. The other choices are unmeasured and unverifiable."},
{i:"q219",d:2,s:"2.1",q:"A business requirement says an internal inventory capability must be reusable across several Claude applications and maintained independently of any one of them. What does this imply?",
o:["Duplicate the logic in each application's system prompt","Build an MCP server exposing the inventory operations as tools","Paste the current inventory data into the context on every request","Rely on a built-in tool, since built-in tools can reach internal REST APIs"],a:1,
r:"Reuse across applications with independent maintenance is the signature of an MCP server. Prompt duplication is neither reusable nor maintainable, pasted data goes stale and wastes context, and built-in tools are a fixed set that cannot reach arbitrary internal APIs."},
{i:"q220",d:2,s:"2.2",q:"A team ships a prompt change directly to production because it is 'not code'. What is the risk they have accepted?",
o:["None; prompts are configuration and carry no behavioural risk","An unreviewed, untested behaviour change with no regression gate and no way to attribute a later regression","Only an increase in token cost","Only a change in response formatting"],a:1,
r:"A prompt edit is a behaviour change in production and needs the same review, version control, and eval regression gate as a code change. Without prompt versioning recorded in traces, a later regression cannot be attributed to the change that caused it."},
{i:"q221",d:2,s:"2.2",q:"Which set of signals should a production Claude application monitor beyond latency and HTTP error rate?",
o:["CPU utilisation and disk I/O only","Token spend, cache hit rate, tool error rate, refusal and truncation rates, and sampled output quality","Only the number of requests per second","Only the model ID in use"],a:1,
r:"LLM systems drift in cost and quality without any error being raised. Cache hit rate, token spend, tool failures, refusals, truncations, and graded output samples are the signals that surface that drift."},
{i:"q222",d:2,s:"2.3",q:"Which stop_reason indicates that Claude declined the request on an otherwise successful response?",
o:["end_turn","stop_sequence","refusal","pause_turn"],a:2,
r:"refusal appears on a normal 200 response when the model declines. It is not retryable as-is and should be handled as a product case. pause_turn indicates a long-running server tool turn that should be continued."},
{i:"q223",d:2,s:"2.5",q:"A multi-tenant application reuses one long-lived Claude session across different customers to save on setup cost. What is the primary problem?",
o:["Sessions expire after one hour anyway","One customer's data remains in context and can influence or leak into another customer's responses","Reusing a session prevents prompt caching","The model will refuse to answer after too many turns"],a:1,
r:"Session isolation is a privacy boundary in multi-tenant systems. Shared context means shared data. It also degrades quality through irrelevant accumulated context — but the leak is the serious issue."},
{i:"q224",d:2,s:"2.4",q:"Which of these is the strongest reason to use enum in a tool's input_schema rather than describing the valid values in the description?",
o:["It reduces the token cost of the schema","It constrains what can be generated rather than only suggesting it","It makes the tool appear earlier in the tool list","It removes the need to validate the input server-side"],a:1,
r:"An enum narrows the space of legal values at generation time, where a description only advises. It does not remove the need for server-side validation — model output is still untrusted input."},
{i:"q225",d:2,s:"2.5",q:"Which is the correct reason to review a Claude Code plugin before installing it organisation-wide?",
o:["Plugins consume context even when disabled","Plugins can bundle hooks and MCP servers, which execute code","Plugins overwrite CLAUDE.md","Plugins disable the permission system"],a:1,
r:"A plugin is a supply-chain surface: it can carry hooks and MCP servers that run code and see your data. Components load only when the plugin is enabled, and plugins do not overwrite CLAUDE.md or disable permissions."},

/* ---------------- DOMAIN 3 ---------------- */
{i:"q301",d:3,s:"3.1",q:"A team wants a multi-step release procedure available to Claude Code only when someone is actually preparing a release. Where should it go?",
o:["In CLAUDE.md so it is always available","In a Skill, whose description names the tasks that should trigger it","In settings.json as a permission rule","In a PreToolUse hook"],a:1,
r:"Skills load on demand when the description matches the task, so occasional procedures cost almost no context until needed. CLAUDE.md is loaded every session, permission rules govern tool access, and hooks are for deterministic enforcement."},
{i:"q302",d:3,s:"3.1",q:"Which command runs Claude Code headlessly for a single prompt and returns structured output?",
o:["claude --resume","claude -p \"prompt\" --output-format json","claude /init","claude --continue"],a:1,
r:"The -p (print) flag is the headless entry point, and --output-format json returns one structured result. --continue and --resume return to prior sessions, and /init generates a starting CLAUDE.md."},
{i:"q303",d:3,s:"3.1",q:"After running /compact, which instruction is most likely to still be in effect?",
o:["A constraint the user typed mid-conversation three turns ago","A rule written in the project-root CLAUDE.md","A tool result from earlier in the session","A one-off correction Claude acknowledged but did not write down"],a:1,
r:"The project-root CLAUDE.md is re-read from disk and re-injected after compaction. Conversation-only instructions and old tool results are subject to lossy summarisation, which is why durable rules belong in files."},
{i:"q304",d:3,s:"3.1",q:"Which Claude Code command tells you which instruction files actually loaded into the current session?",
o:["/status","/context","/hooks","/mcp"],a:1,
r:"/context lists memory files actually in context. /status shows which settings sources loaded, /hooks browses configured hooks, and /mcp shows server connections."},

/* ---------------- DOMAIN 4 ---------------- */
{i:"q401",d:4,s:"4.1",q:"Your service begins receiving HTTP 529 responses during a traffic spike that is well within your rate limit. What is the correct response?",
o:["Request a rate limit increase from Anthropic","Retry with exponential backoff, since 529 means the API is temporarily overloaded across users","Fix the request body, since 529 indicates a malformed request","Switch to a larger model to reduce the number of calls"],a:1,
r:"529 is overloaded_error: server-side capacity, unrelated to your quota. Back off and retry, and consider a fallback model. A quota increase addresses 429, which is your usage against your own limit."},
{i:"q402",d:4,s:"4.1",q:"A tool inside an agent loop throws an exception, and the harness lets it propagate, ending the run. What should it do instead?",
o:["Retry the same tool call indefinitely until it succeeds","Return a tool_result with is_error true and an actionable message so Claude can adapt","Silently skip the tool and continue with an empty result","Restart the session from the beginning"],a:1,
r:"Returning the failure as a tool result keeps the loop alive and lets Claude choose another route, which is the whole point of the pattern. Silent empty results cause the model to reason from false information, infinite retry is not a strategy, and restarting discards all progress."},
{i:"q403",d:4,s:"4.1",q:"An agent produces a wrong final answer after nine turns. What is the most effective first step in trace analysis?",
o:["Rewrite the system prompt and re-run","Work backwards to the first turn where the state diverged from expectation","Increase the iteration cap","Switch to a more capable model"],a:1,
r:"Agents fail long before they visibly fail. A bad tool result at turn three produces a wrong answer at turn nine, so the fix belongs at the divergence point. Changing the prompt or model before locating the divergence is guesswork."},
{i:"q404",d:4,s:"4.1",q:"A structured-output integration works in testing but intermittently fails to parse in production. Which check best isolates whether the problem is your integration or the model?",
o:["Raise the temperature to see if output changes","Log the exact outbound request body for failing cases and replay it in isolation","Add a second model call to check the first","Increase max_tokens and redeploy"],a:1,
r:"Replaying the exact request settles the question: if the behaviour reproduces, it is the prompt, tools, or model; if it does not, the integration is sending something other than what you assumed."},
{i:"q405",d:4,s:"4.1",q:"Which of these is a failure that returns HTTP 200?",
o:["413 request_too_large","A response with stop_reason max_tokens","401 authentication_error","529 overloaded_error"],a:1,
r:"Truncation at the max_tokens ceiling arrives on a successful response. So do refusals and model_context_window_exceeded. These are the failures that silently corrupt downstream data if you only check the HTTP status."},

/* ---------------- DOMAIN 5 ---------------- */
{i:"q501",d:5,s:"5.1",q:"Which statement about temperature is correct?",
o:["Temperature 0 guarantees identical output for identical input across calls and versions","Temperature controls the shape of the sampling distribution and does not guarantee determinism","Raising temperature improves resistance to prompt injection","Temperature caps the number of output tokens"],a:1,
r:"Temperature flattens or sharpens the next-token distribution. Even at 0 you should not rely on byte-identical output, particularly across model versions. It has no security effect, and max_tokens is what caps output length."},
{i:"q502",d:5,s:"5.1",q:"A classification prompt produces the right answer most of the time but formats it inconsistently. Which technique gives the largest improvement for the least effort?",
o:["Raising the effort level","Adding several diverse few-shot examples that all follow the exact target format","Increasing max_tokens","Switching to a larger model"],a:1,
r:"Multi-shot examples are the most reliable lever for output consistency, because they demonstrate the boundary cases prose describes badly. Effort and model size address reasoning difficulty, not formatting drift."},
{i:"q503",d:5,s:"5.2",q:"A mobile application streams Claude responses. Where should the Anthropic API key live?",
o:["Embedded in the mobile app so the client can stream directly","On your server, which proxies requests and streams to the client","In the app's local storage, encrypted","Split between the client and the server"],a:1,
r:"A key shipped to a client is a key given to every user, regardless of encryption. The server holds the key, enforces authorisation, applies per-user rate limits, and logs — then streams to the client over SSE or a websocket."},
{i:"q504",d:5,s:"5.2",q:"The Claude API streams responses using which transport?",
o:["WebSocket","Server-sent events over HTTP","gRPC bidirectional streaming","Long polling"],a:1,
r:"The Messages API streams over SSE. Websockets are the right choice between your own server and your own browser client, where bidirectional traffic such as user interruption matters."},
{i:"q505",d:5,s:"5.3",q:"A high-volume pipeline tags 2 million short support messages by topic. Quality requirements are modest. Which model is the sensible starting point?",
o:["Claude Fable 5.1","Claude Opus 5","Claude Haiku 4.5","Claude Sonnet 5"],a:2,
r:"High-volume, low-difficulty classification is exactly what Haiku is for, and the spread between Haiku and the top tier is roughly 10x on both input and output. Start there, measure with evals, and escalate only the subset that fails."},
{i:"q506",d:5,s:"5.3",q:"A team must summarise 400,000-token legal documents. Which constraint rules out Claude Haiku 4.5?",
o:["Haiku does not support streaming","Haiku's context window is 200K tokens","Haiku cannot use tools","Haiku does not support the Batch API"],a:1,
r:"Haiku 4.5 has a 200K context window, while Fable 5.1, Opus 5, and Sonnet 5 offer 1M. The document exceeds Haiku's ceiling regardless of quality considerations."},
{i:"q507",d:5,s:"5.3",q:"After migrating from an older model to a newer generation at the same or lower per-token rate, the monthly bill rises. What is the most likely explanation?",
o:["The new model ignores prompt caching","The newer tokeniser produces more tokens for the same text","Batch discounts do not apply to newer models","The new model always uses maximum effort"],a:1,
r:"Tokenisers change between model generations, and a newer one can map the same text to noticeably more tokens. A lower headline rate is not automatically a lower bill, which is why you re-measure on real traffic after a migration."},
{i:"q508",d:5,s:"5.4",q:"Which cache configuration pays for itself after a single subsequent read?",
o:["The 1-hour cache write at 2x base input","The 5-minute cache write at 1.25x base input","Any cache write, since reads are free","Neither; caching always requires at least three reads"],a:1,
r:"A 5-minute write costs 1.25x and a read costs 0.1x, so one read already beats paying full input price twice. The 1-hour write at 2x needs two reads to break even. Reads are cheap but not free."},
{i:"q509",d:5,s:"5.4",q:"Which change reduces input token cost on a chat application with a large stable system prompt?",
o:["Lowering max_tokens","Placing the stable system prompt and tool definitions first and caching that prefix","Raising the temperature","Removing the stop_sequences parameter"],a:1,
r:"Caching a large stable prefix is usually the single biggest input-side saving, at 0.1x base input per read. max_tokens affects only output, and temperature and stop sequences have no cost effect of this kind."},
{i:"q510",d:5,s:"5.4",q:"Which item is billed as output tokens?",
o:["Tool definitions in the tools parameter","Extended thinking blocks","Cache read tokens","The system prompt"],a:1,
r:"Thinking is generated, so it is billed as output — which is why high effort raises cost noticeably. Tool definitions, the system prompt, and cache reads are all input-side."},
{i:"q511",d:5,s:"5.1",q:"What does the effort setting control on models that support it?",
o:["The maximum number of tool calls per turn","How much the model reasons before answering, trading latency and tokens for quality","The number of cache breakpoints allowed","The retry behaviour of the SDK"],a:1,
r:"Effort governs adaptive thinking depth on models that support it. Haiku 4.5 uses extended thinking and does not support the effort parameter — a detail worth remembering when migrating code across tiers."},
{i:"q512",d:5,s:"5.4",q:"Which is true about tool definitions and cost?",
o:["Tool definitions are free because they are not user content","Tool definitions are billed as input tokens on every request, plus a tool-use system prompt whenever any tool is present","Tool definitions are billed once per session","Tool definitions are billed as output tokens"],a:1,
r:"Every tool schema is in the request and billed as input on every call, and the API adds a tool-use system prompt of a few hundred tokens whenever tools are present. Trimming unused tools is a real saving, and caching the remaining ones is another."},

/* ---------------- DOMAIN 6 ---------------- */
{i:"q601",d:6,s:"6.1",q:"An agent on a long task starts ignoring constraints given early in the session and its cost per turn keeps climbing. What is the most likely cause?",
o:["The model is degrading and should be replaced","Context bloat: the window has filled with low-signal tokens competing for attention","The temperature drifted upward over the session","max_tokens is too low"],a:1,
r:"Rising cost per turn plus forgotten early instructions is the classic bloat signature. The fixes are pruning tool results, retrieving slices instead of whole files, isolating exploration in subagents, compacting at task boundaries, and restating key constraints late in the context."},
{i:"q602",d:6,s:"6.1",q:"Which technique most directly reduces the number of tokens the main agent pays for during a large codebase search?",
o:["Raising the effort level","Delegating the search to a subagent that returns only its findings","Increasing max_tokens","Lowering the temperature"],a:1,
r:"Context isolation is the strongest lever: the subagent burns its own window and returns a compact summary, so the parent pays for the summary rather than the exploration."},
{i:"q603",d:6,s:"6.2",q:"Which instruction is written in the form models follow most reliably?",
o:["Do not be too verbose","Avoid using markdown formatting","Answer in at most three sentences of plain text","Try not to include unnecessary detail"],a:2,
r:"Specific, positive, verifiable instructions outperform negative or vague ones. Negative phrasing still puts the unwanted behaviour into context, and 'too verbose' and 'unnecessary' are not measurable."},
{i:"q604",d:6,s:"6.2",q:"Which content belongs in the user turn rather than the system prompt?",
o:["The application's refusal policy","The required output schema","A user-uploaded document to be analysed","The assistant's role and tone"],a:2,
r:"Per-request, untrusted content goes in the user turn: it preserves the trust boundary and keeps the volatile part out of the cacheable system prefix. Role, policy, and format contract are stable and belong in system."},
{i:"q605",d:6,s:"6.2",q:"A prompt has grown to 2,000 words of accumulated rules and now performs worse than it did. What is the recommended next step?",
o:["Add more rules to cover the remaining failures","Cut back to the essential instruction plus a few well-chosen examples and re-evaluate","Raise the temperature to increase flexibility","Split the prompt across two model calls"],a:1,
r:"Long prompts accrete patches that eventually contradict each other, and over-specified prompts also migrate badly to newer models. Prefer adding an example over adding a rule, and removing an instruction over adding a qualifier."},
{i:"q606",d:6,s:"6.3",q:"A JSON parse of Claude's response fails intermittently in production. Which handling is correct?",
o:["Repair the string with regular expressions and continue","Validate, then retry once including the parser error in the retry, then fail closed","Ignore the failure and use the previous successful response","Lower the temperature to zero and retry indefinitely"],a:1,
r:"Never salvage half-valid output with string surgery — that is how plausible wrong data reaches production. One informed retry, then fail closed. Reusing a stale response is a correctness bug, and unbounded retries are not a recovery strategy."},
{i:"q607",d:6,s:"6.3",q:"An extraction pipeline validates the model's JSON against a schema, yet bad records still reach the database. What layer is missing?",
o:["Syntactic validation","Semantic validation of whether the values are plausible and resolvable","A larger model","A higher max_tokens value"],a:1,
r:"Schema validation confirms shape and type. A date in 1842, a negative total, or an order ID that does not exist all pass it. Invariant checks in code are the missing layer."},
{i:"q608",d:6,s:"6.3",q:"Which technique most strongly constrains Claude to produce a specific JSON shape?",
o:["Asking for JSON in the system prompt","Defining a tool whose input_schema is the target shape and forcing it with tool_choice, or using SDK structured outputs","Setting stop_sequences to a closing brace","Lowering the temperature"],a:1,
r:"Schema-constrained generation through a forced tool call, or SDK structured outputs with a JSON Schema, Zod, or Pydantic model, constrains generation rather than requesting it. Prompt instructions and temperature only make compliance likelier."},
{i:"q609",d:6,s:"6.2",q:"You want untrusted retrieved text to be treated as data. Which combination is most effective?",
o:["A system-prompt line asking Claude to ignore embedded instructions","Delimited and labelled untrusted blocks, the instruction placed after them, and least-privilege tools plus deterministic gates","A higher temperature so injected instructions are less likely to be followed","A larger model that follows instructions more precisely"],a:1,
r:"Structural separation plus least privilege plus deterministic gates is the layered answer. A prompt line alone is necessary but insufficient, temperature is irrelevant, and better instruction-following can increase susceptibility rather than reduce it."},

/* ---------------- DOMAIN 7 ---------------- */
{i:"q701",d:7,s:"7.1",q:"A Claude-powered agent summarises user-submitted web pages. One page contains hidden text instructing the model to reveal its system prompt. Which mitigation is most effective?",
o:["Raise the model's temperature so behaviour is harder to predict","Treat retrieved page content as untrusted input, keep it separate from trusted instructions, and use guardrails or hooks so injected instructions cannot trigger sensitive actions","Add a line to the system prompt asking users not to include malicious instructions","Switch to a larger model that follows instructions more reliably"],a:1,
r:"Prompt injection is addressed by isolating untrusted content from trusted instructions and enforcing least-privilege guardrails so injected text cannot invoke sensitive tools. Temperature is irrelevant, a polite request is not an enforceable control, and a more instruction-following model can be more susceptible rather than less."},
{i:"q702",d:7,s:"7.1",q:"A tool lets Claude query customer records and takes a customer_id argument that the model supplies. What is the security flaw?",
o:["The tool should return more fields so Claude has full context","Identity must come from the authenticated session server-side; letting the model choose the ID allows access to any customer","The tool needs a longer description","The customer_id should be an integer rather than a string"],a:1,
r:"The model is not an authorisation layer. Derive identity from the authenticated session and scope the query server-side. A model-supplied identifier can be influenced by user input or by injected content."},
{i:"q703",d:7,s:"7.2",q:"Which describes correct guardrail layering for an agent with write access to production systems?",
o:["A single well-written system prompt covering all the rules","Input validation, prompt-level scope, tool allow and deny rules, output validation, sandboxing, and human approval on irreversible actions","Output filtering alone, since that is the last line of defence","A classifier that scores the user's intent before each request"],a:1,
r:"Guardrails degrade independently, so no single layer is sufficient. Layering means a bypass of one control still meets another, and the outer layers do not depend on the model behaving."},
{i:"q704",d:7,s:"7.3",q:"A PreToolUse hook is meant to block dangerous shell commands. It prints an error to stderr and exits with code 1. What happens?",
o:["The tool call is blocked and Claude sees the stderr message","The tool call proceeds, because only exit code 2 blocks","The session terminates immediately","The hook is retried until it returns 0"],a:1,
r:"Exit code 2 is the blocking code. Any other non-zero code, including the conventional Unix failure code 1, is a non-blocking error and the action proceeds — which is exactly how a policy hook silently fails open."},
{i:"q705",d:7,s:"7.3",q:"Which hook matcher correctly matches every tool from an MCP server named github?",
o:["mcp__github","github","mcp__github__.*","mcp:github:*"],a:2,
r:"A matcher containing only exact-match characters is compared as a literal string, so mcp__github matches nothing. Adding .* puts it on the regular-expression path and matches every tool from that server."},
{i:"q706",d:7,s:"7.3",q:"Which hook event can prevent a destructive tool call from running?",
o:["PostToolUse","PreToolUse","SessionEnd","PostToolUseFailure"],a:1,
r:"PreToolUse fires before the call and can deny it. PostToolUse and PostToolUseFailure run after the tool has already executed, so they can report and remediate but not prevent."},
{i:"q707",d:7,s:"7.4",q:"An API key was committed to a repository and the commit was reverted within minutes. What is the correct response?",
o:["No action needed, since the commit was reverted","Rotate the key immediately; it remains in git history and possibly in clones and caches","Add the file to .gitignore and continue","Rename the key in the secret manager"],a:1,
r:"A reverted commit is still in history, and any clone, fork, or cache made in the interval still has it. Treat the key as compromised and rotate it."},
{i:"q708",d:7,s:"7.2",q:"An input classifier that screens requests for policy violations becomes unavailable. What should the application do?",
o:["Continue without the check, since most requests are benign","Fail closed: reject or queue requests until the check is available","Raise the temperature to compensate","Switch to a smaller model to reduce load"],a:1,
r:"An unavailable check is not a passed check. Secure-by-design means failing closed when a control cannot run, rather than proceeding on the assumption that things are probably fine."},

/* ---------------- DOMAIN 8 ---------------- */
{i:"q801",d:8,s:"8.1",q:"A team needs Claude to call an internal inventory service exposed as a REST API. The capability must be reusable across several Claude applications and maintained independently of any one app. Which approach fits best?",
o:["Hard-code the inventory logic into each application's system prompt","Build an MCP server that exposes the inventory operations as tools so multiple Claude applications can connect to it","Paste the current inventory data into the context window on every request","Rely on a built-in tool, since built-in tools can reach any internal REST API"],a:1,
r:"An MCP server exposes reusable tools that multiple applications share and that can be maintained independently. Prompt hard-coding is neither reusable nor maintainable, pasted data gives no live access and wastes context, and built-in tools do not automatically reach arbitrary internal APIs."},
{i:"q802",d:8,s:"8.1",q:"Claude has a suitable tool registered but never calls it. Which is the most likely cause?",
o:["The tool's input_schema uses enum values","The description explains what the tool does but not when to use it","The tool name is too short","tool_choice is set to auto"],a:1,
r:"Selection is driven by the description, and the 'when to use this' clause is the part people omit. Enums help rather than hinder, and auto is the normal default that permits tool use."},
{i:"q803",d:8,s:"8.3",q:"Claude can already access a team's data through existing tools but formats the weekly report incorrectly every time. What is the right extension mechanism?",
o:["A new custom tool for report generation","A Skill that encodes the team's report procedure and format","An MCP server for the reporting system","A PreToolUse hook that rewrites the output"],a:1,
r:"The capability exists; the knowledge does not. A Skill teaches a procedure and loads on demand. A tool or MCP server would add capability that is not missing, and hooks are for deterministic enforcement rather than formatting knowledge."},
{i:"q804",d:8,s:"8.3",q:"Which statement correctly distinguishes Skills from tools?",
o:["Skills are faster versions of tools","A Skill teaches a procedure and loads on demand; a tool grants a capability and its definition is in context whenever it is registered","Skills can only be used in Claude Code, tools only through the API","Tools are written in Markdown, Skills in JSON"],a:1,
r:"The capability-versus-procedure distinction is the core one, and the context-cost difference follows from it: skills cost almost nothing until invoked, while every registered tool definition is billed input on every request."},
{i:"q805",d:8,s:"8.2",q:"Which MCP transport is appropriate for a server that runs locally alongside the client and needs no network exposure?",
o:["HTTP with server-sent events","stdio, with the client launching the server as a subprocess","WebSocket","gRPC"],a:1,
r:"stdio has the client launch the server as a subprocess and speak JSON-RPC over stdin and stdout, which suits local servers such as filesystem or local database access. Remote shared servers use HTTP with SSE and need real authentication."},
{i:"q806",d:8,s:"8.2",q:"Which MCP primitive is model-controlled?",
o:["Resources","Prompts","Tools","Transports"],a:2,
r:"Tools are model-controlled: Claude decides to call them. Resources are application-controlled readable data, and prompts are user-controlled templates typically surfaced as slash commands."},
{i:"q807",d:8,s:"8.1",q:"A tool returns a 200 KB JSON payload when only six fields matter to the task. What is the consequence?",
o:["No consequence; extra fields are ignored","The payload floods the context window, raising cost on every subsequent turn and crowding out signal","The API rejects tool results over 100 KB","The model automatically summarises it"],a:1,
r:"Tool results enter the conversation and are re-sent on every following turn. Returning what is useful rather than what is available is a core tool-design rule and one of the largest sources of avoidable context bloat."},
{i:"q808",d:8,s:"8.3",q:"An organisation wants every engineer to have the same Claude Code commands, skills, subagents, hooks, and MCP servers, with versions pinned. What is the right mechanism?",
o:["A README describing which files to copy","A plugin distributed through an organisation marketplace with dependency versions constrained","A single large CLAUDE.md committed to every repository","Managed settings alone"],a:1,
r:"Plugins package commands, skills, subagents, hooks, and MCP servers as one installable unit, distributed through a marketplace with version constraints. Managed settings enforce policy but do not distribute components, and copied files drift immediately."},
{i:"q809",d:8,s:"8.2",q:"Why should MCP tool results be treated as untrusted content even when you wrote the server?",
o:["Because MCP servers cannot be authenticated","Because the data the server returns may originate elsewhere and can carry injected instructions","Because MCP results bypass the context window","Because the protocol does not support error handling"],a:1,
r:"Trust in the server author says nothing about the data the server relays. A server returning email bodies, web content, or third-party records is delivering attacker-influenceable content into your context."}
];

/* ============ GLOSSARY ============ */
const GLOSS=[
["Adaptive thinking","Thinking where the model decides how much to reason per request, controlled by an effort level rather than a fixed token budget. Always on for Fable 5.1; not supported on Haiku 4.5."],
["Agent","A system where the model chooses the next step at run time from available tools, rather than following a path fixed in your code."],
["Agentic loop","The cycle of send request, inspect stop_reason, execute tools, append results, repeat until end_turn."],
["Agent SDK","Anthropic's Python and TypeScript library that runs Claude Code's agent loop as a library, with built-in tools, hooks, subagents, permissions, and sessions. Formerly the Claude Code SDK."],
["Auto memory","Notes Claude Code writes for itself per repository. The MEMORY.md index loads at session start; topic files load on demand."],
["Batch API","Asynchronous processing of many requests within a 24-hour window at 50% off input and output. Stacks with prompt caching."],
["CLAUDE.md","A Markdown file of standing instructions for Claude Code. Delivered as a user message after the system prompt — context, not enforcement. Files concatenate across scopes."],
["cache_control","The field marking a cacheable prefix, either once at the top level for automatic caching or on specific content blocks. Maximum four explicit breakpoints per request."],
["Compaction","Summarising the conversation so far and continuing from the summary. Lossy by design."],
["Content block","The unit of a Messages request or response: text, tool_use, tool_result, thinking, image, document, server_tool_use."],
["Context engineering","Curating what occupies the context window over a long session, as distinct from writing a single prompt well."],
["Context window","The total token budget for system prompt, tools, history, documents, thinking, and the response. 1M on current top models; 200K on Haiku 4.5."],
["Effort level","A setting controlling how much the model reasons, from low through high, with xhigh and max on some models."],
["Few-shot / multi-shot","Supplying several worked examples in the prompt. The most reliable technique for output consistency."],
["Hook","Code that Claude Code runs automatically at a lifecycle event. Exit code 2 blocks on events that can block; exit 1 does not."],
["Indirect prompt injection","Malicious instructions planted in content the agent retrieves — a web page, document, email, or tool result — rather than typed by the user."],
["MCP","Model Context Protocol. An open protocol in which a host runs one client per server; servers expose tools, resources, and prompts over stdio, HTTP with SSE, or in-process."],
["Managed Agents","Anthropic-hosted agent infrastructure with stateful sessions and persistent event history, billed on tokens plus session runtime."],
["Managed settings","Organisation-deployed configuration that sits above every other settings scope and cannot be overridden from below, except where a stricter value is honoured."],
["Orchestrator–workers","A pattern where a lead model decomposes the task at run time and dispatches to workers. The run-time decomposition is what makes it agentic."],
["Permission mode","How much Claude Code asks before acting: default, plan, acceptEdits, auto, dontAsk, bypassPermissions. Deny rules win in every mode."],
["Plugin","An installable bundle of commands, skills, subagents, hooks, and MCP servers, distributed through a marketplace with pinnable versions."],
["Prompt caching","Reusing a processed prompt prefix across requests. Lookup runs tools, then system, then messages; reads cost 0.1x base input."],
["Rules","Topic files in .claude/rules/. With paths: frontmatter they load only when Claude touches matching files."],
["Server-side tool","A tool that runs on Anthropic's infrastructure inside the turn, such as web search or code execution. Reported in usage.server_tool_use."],
["Skill","A folder with SKILL.md whose description makes it discoverable. Teaches a procedure and loads on demand, so it costs almost no context until used."],
["stop_reason","The authoritative signal for what happens next: end_turn, tool_use, max_tokens, stop_sequence, pause_turn, refusal, model_context_window_exceeded."],
["Structured outputs","Returning validated typed data by supplying a JSON Schema, Zod, or Pydantic model, rather than asking for JSON in prose."],
["Subagent","A nested agent with its own context window, system prompt, and tool set. Communicates with its parent by summary only."],
["Tool search","Loading tool definitions on demand rather than registering all of them, for agents with very large tool sets."],
["tool_choice","Controls tool selection: auto, any, a named tool, or none."],
["Workflow","A system where the sequence of model calls is fixed in your code. Deterministic, testable, and cheaper than an agent."]
];

  return '<figure>'+f.s+'<figcaption>'+f.c+'</figcaption></figure>';}
function body(html){return html.replace(/\[\[FIG:([a-z-]+)\]\]/g,(m,n)=>fig(n));}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function pct(n,d){return d?Math.round(n/d*100):0;}

function quizHTML(q,idx,mode){
  const keys=["A","B","C","D","E"];
  let h='<div class="quiz" data-q="'+q.i+'">';
  h+='<div class="qmeta">Domain '+q.d+' · '+q.s+(mode==="exam"?" · item "+(idx+1):"")+'</div>';
  h+='<div class="qstem">'+esc(q.q)+'</div>';
  q.o.forEach((o,k)=>{h+='<button class="opt" data-k="'+k+'"><span class="k">'+keys[k]+'</span><span>'+esc(o)+'</span></button>';});
  h+='<div class="rat" hidden></div></div>';
  return h;
}
function wireQuiz(root,mode){
  root.querySelectorAll(".quiz").forEach(box=>{
    const q=Q.find(x=>x.i===box.dataset.q)||box._q;
    const qq=box._q||q;
    box.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const k=+btn.dataset.k;
        if(mode==="exam"){
          box.querySelectorAll(".opt").forEach(b=>b.dataset.s="");
          btn.dataset.s="sel";box._pick=k;updateExamBar();return;
        }
        if(box._answered)return;box._answered=true;
        const ok=k===qq.a;
        box.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
          if(+b.dataset.k===qq.a)b.dataset.s="right";else if(b===btn)b.dataset.s="wrong";});
        const rat=box.querySelector(".rat");
        rat.className="rat "+(ok?"ok":"no");
        rat.innerHTML='<span class="vd">'+(ok?"Correct.":"Not quite.")+'</span>'+esc(qq.r);
        rat.hidden=false;
      });
    });
  });
}
